description: IDrive e2 MCP connects IDrive e2 object storage to MCP clients (Claude, Cursor, Codex, ChatGPT, Grok). Hosted
  endpoint https://mcp.idrivee2.com/s3 is OAuth-protected (RFC 9728 metadata served; anonymous tools/list returns 401 invalid_token,
  probed 2026-10-13). A self-hosted server listens by default on http://127.0.0.1:1908/s3 and supports only username/password
  auth. Tool names captured verbatim from the FAQ (28 read-only, 37 read-write); input schemas need authenticated introspection.
deployment:
  mode: both
  verified: probed
  endpoint: https://mcp.idrivee2.com/s3
  local_endpoint: http://127.0.0.1:1908/s3
server:
  name: idrive-e2
  transport: http
  url: https://mcp.idrivee2.com/s3
  auth: oauth2
  protected_resource: well-known/idrive-oauth-protected-resource.json
  authorization_server: https://api.idrivee2.com/oauth
probes:
- url: https://mcp.idrivee2.com/s3
  method: POST tools/list
  status: 401
  body: '{"error":"invalid_token"}'
- url: https://api.idrivee2.com/.well-known/oauth-protected-resource
