aid: idrive
name: IDrive
image: https://static.idriveonlinebackup.com/include/images/idrive-image.png
description: IDrive Inc. provides cloud backup and IDrive e2, an S3-compatible object storage service. For developers it publishes
  the IDrive e2 Reseller API (a REST/JSON API at api.idrivee2.com for managing users, regions, access keys, CNAME whitelabeling
  and subusers, authenticated with an API key sent in a token header), the S3-compatible storage endpoints themselves, and
  IDrive e2 MCP, an OAuth-protected hosted Model Context Protocol server at mcp.idrivee2.com/s3 (with a self-hosted option)
  exposing 65 bucket and object tools to AI clients.
